name: CI

on:
  pull_request:
  # master への push 時は publish.yml から呼ばれる
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # カバレッジレポートを PR にコメントする
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check src tests
      - run: uv run mypy src
      - id: pytest
        run: uv run pytest --cov
      # テストが失敗してもカバレッジは出す (テストまで進まなかった場合は除く)
      - name: Build coverage report
        if: ${{ !cancelled() && steps.pytest.outcome != 'skipped' }}
        run: |
          {
            echo "## Coverage"
            echo
            uv run coverage report --format=markdown
          } > "$RUNNER_TEMP/coverage.md"
          cat "$RUNNER_TEMP/coverage.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Comment coverage report on the pull request
        if: ${{ !cancelled() && steps.pytest.outcome != 'skipped' && github.event_name == 'pull_request' }}
        uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          header: coverage
          path: ${{ runner.temp }}/coverage.md
      - run: uv build
