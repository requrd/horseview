[project]
authors = [{ "name" = "requrd", "email" = "requrd1989@gmail.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
name = "jrdb-model"
version = "0.2.15"
description = "ORM for JRDB"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.0",
    "flask-migrate>=4.1.0",
    "flask-sqlalchemy>=3.1.1",
    "pymysql>=1.1.1",
    # Flask-SQLAlchemy 3.1 は SQLAlchemy 2.1 の MappedAsDataclass と互換性がない
    "sqlalchemy>=2.0.16,<2.1",
]

[project.urls]
"Bug Tracker" = "https://github.com/requrd/horseview/issues"
Homepage = "https://github.com/requrd/horseview"

[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = ["mypy>=1.15.0", "pytest>=8.3.5", "pytest-cov>=6.0.0", "ruff>=0.11.10"]

[tool.ruff.lint]
select = ["RUF", "I", "SIM", "FURB", "PIE", "PERF", "C4", "B", "PL", "D", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101", "PLR2004"]

[tool.ruff.format]
docstring-code-format = true
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = ["flask_migrate"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["jrdb_model"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.setuptools.package-data]
# 利用側で型チェックできるよう、型情報を持つことを示すマーカーを同梱する
jrdb_model = ["py.typed"]
